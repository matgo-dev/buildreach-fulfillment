# ============================================================
# 履约后台 · 应用编排(仅 backend + frontend)
#
# 本文件只定义【应用】。三样「应用之外」的资源由 .env / 宿主承载,应用不感知:
#   · 库           → .env 的 DATABASE_URL 指向(初期=db 容器,见 override;生产=OVH 托管 PG)
#   · 对象存储     → .env 的 STORAGE_BACKEND + S3_*(初期=minio 容器;生产=OVH Object Storage)
#   · 反向代理+TLS → 宿主机 1Panel(OpenResty)承载,不在 compose 内
# 应用端口只绑 127.0.0.1,一律由 1Panel 反代对外(不直接暴露公网)。
#
# ── 初期(阿里云 ECS,库/对象存储用容器)──
#     docker compose up -d --build
#     (docker compose 默认自动合并 docker-compose.override.yml,连带起 db + minio)
#
# ── 生产(OVH,库=托管 PG、对象存储=OVH Object Storage)──
#     docker compose -f docker-compose.yml up -d --build
#     (只起应用;不带 override,.env 里 DATABASE_URL / S3_* 指向 OVH 托管)
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # —— 库:由 .env 指向(初期→override 的 db 容器;生产→OVH 托管 PG)——
      DATABASE_URL: ${DATABASE_URL:?请在 .env 设 DATABASE_URL(初期指 db:5432,生产指 OVH 托管 PG)}

      # —— 对象存储:由 .env 指向(初期→minio 容器;生产→OVH Object Storage)——
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-fulfillment-attachments}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}

      # —— JWT ——
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 .env 设 JWT_SECRET_KEY(>=16 字符随机串)}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # —— 引导管理员(启动时幂等 seed)——
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?请在 .env 设 SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:?请在 .env 设 SUPER_ADMIN_INITIAL_PASSWORD}

      # —— CORS(对外访问 origin;初期 http://<IP>,生产 https://<域名>)——
      CORS_ORIGINS: ${CORS_ORIGINS:?请在 .env 设 CORS_ORIGINS(对外访问的 origin)}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}

      # —— Refresh cookie(HTTP 阶段 SECURE=false;接 HTTPS 后 true)——
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      REFRESH_COOKIE_MAX_AGE: ${REFRESH_COOKIE_MAX_AGE:-604800}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}

      # —— 登录限流 / 代理信任 ——
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_MAX_FAILURES: ${LOGIN_RATE_LIMIT_MAX_FAILURES:-5}
      LOGIN_RATE_LIMIT_LOCK_SECONDS: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:-300}
      # 前置 1Panel/OpenResty 反代且端口只绑 127.0.0.1 → 可信,置 true(读 X-Forwarded-For)
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUST_INBOUND_TRACE_ID: ${TRUST_INBOUND_TRACE_ID:-false}

      # —— 其它 ——
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      ACCOUNT_LOCK_THRESHOLD: ${ACCOUNT_LOCK_THRESHOLD:-10}
      ACCOUNT_LOCK_MINUTES: ${ACCOUNT_LOCK_MINUTES:-15}
    # 只绑 127.0.0.1:由宿主 1Panel 反代对外,应用端口不直接暴露公网
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8001}:8000"
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 浏览器访问后端的公网地址,构建时内联进 bundle(初期 http://<IP>,生产 https://<域名>)
        API_BASE_URL: ${API_BASE_URL:?请在 .env 设 API_BASE_URL(对外访问后端的公网地址)}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # SSR 侧运行时也读它(与构建内联同值)
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3000"
    logging: *default-logging
