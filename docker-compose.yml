# ============================================================
# 履约后台 · 本地整机构建测试(build 模式)
#
# 用途:本地一次性把整套(db+minio+backend+frontend)build 起来验证。
# 不用途:① 本地开发(走 uvicorn --reload + pnpm dev,见 README「本地开发」);
#         ② 服务器部署(走 docker-compose.production.yml 拉镜像 + deploy/deploy.sh)。
#
# 反向代理 + TLS 由宿主 1Panel(OpenResty)承载,不在 compose 内;应用端口只绑 127.0.0.1。
#
# 启动:cp .env.example .env && docker compose up -d --build
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillment}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设 POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulfillment} -d ${POSTGRES_DB:-fulfillment}"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "5432"
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 设 MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    # 不设 healthcheck:minio 镜像无 curl/wget(仅 mc),原 curl 健康检查必挂;
    # 就绪由下面 minio-init 自带重试保证。
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD} >/dev/null 2>&1 && mc ls local >/dev/null 2>&1; do echo 'waiting for minio...'; sleep 2; done &&
      mc mb --ignore-existing local/${S3_BUCKET:-fulfillment-attachments}
      "
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fulfillment}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fulfillment}
      # 对象存储 → compose 内 minio(s3 兼容)
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minio}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_BUCKET: ${S3_BUCKET:-fulfillment-attachments}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请在 .env 设 JWT_SECRET_KEY(>=16 字符)}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:?}
      CORS_ORIGINS: ${CORS_ORIGINS:?请设为对外访问 origin}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      REFRESH_COOKIE_MAX_AGE: ${REFRESH_COOKIE_MAX_AGE:-604800}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_MAX_FAILURES: ${LOGIN_RATE_LIMIT_MAX_FAILURES:-5}
      LOGIN_RATE_LIMIT_LOCK_SECONDS: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:-300}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUST_INBOUND_TRACE_ID: ${TRUST_INBOUND_TRACE_ID:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      ACCOUNT_LOCK_THRESHOLD: ${ACCOUNT_LOCK_THRESHOLD:-10}
      ACCOUNT_LOCK_MINUTES: ${ACCOUNT_LOCK_MINUTES:-15}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-17858}:8000"
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 运行时注入:entrypoint.sh 生成 __env.js 供浏览器读取
      API_BASE_URL: ${API_BASE_URL:?请在 .env 设 API_BASE_URL(对外访问后端的公网地址)}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-7858}:3000"
    logging: *default-logging

volumes:
  pgdata:
    name: fulfillment_pgdata
  miniodata:
    name: fulfillment_miniodata
