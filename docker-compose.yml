# ============================================================
# 履约系统 · 整机部署/演示编排
#
# 用途:整机部署演示(db + backend + minio + frontend 一起起)
# 不用途:本地开发 —— 本地开发复用现有 brew PG(fulfillment_dev/test @ :5433),
#         走 `uvicorn --reload` + `pnpm dev`,不需要这份 compose(见 README)。
#
# 无 nginx:本仓库无 deploy/nginx.conf,M0 阶段直连 backend/frontend 端口即可,
# 需要反向代理时再按需补。
#
# 启动:docker compose --env-file .env up -d --build db minio backend
#   (frontend 服务尚无 Dockerfile,勿用裸 `up`;详见下方 frontend 服务处注释)
#   minio-init 会随 backend 一起自动跑(一次性建 bucket,幂等),不需要单独指定。
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillment}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulfillment} -d ${POSTGRES_DB:-fulfillment}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 不对外暴露 5432,只在 compose 内部网络可见
    expose:
      - "5432"
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # 一次性初始化:等 minio 健康后建好业务用的 bucket(幂等,--ignore-existing)。
  # 没有这个,第一次上传附件会因 bucket 不存在报 NoSuchBucket(500)。
  # 生产走云对象存储时 bucket 由运维预先建好,不需要这个服务。
  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-fulfillment-attachments}
      "
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # 数据库连接(从 POSTGRES_* 拼出,连 compose 内的 db 服务)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fulfillment}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fulfillment}

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # 初始 super admin(启动时幂等 seed)
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD}

      # CORS(逗号分隔)
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}

      # Refresh token cookie(纯 HTTP 部署:SECURE=false;接 HTTPS 后改 true)
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      REFRESH_COOKIE_MAX_AGE: ${REFRESH_COOKIE_MAX_AGE:-604800}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}

      # 登录限流
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_MAX_FAILURES: ${LOGIN_RATE_LIMIT_MAX_FAILURES:-5}
      LOGIN_RATE_LIMIT_LOCK_SECONDS: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:-300}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUST_INBOUND_TRACE_ID: ${TRUST_INBOUND_TRACE_ID:-false}

      # 日志
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API 文档开关(生产保持 false)/ HSTS(接 HTTPS 后开)/ 账号级登录锁定
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      ACCOUNT_LOCK_THRESHOLD: ${ACCOUNT_LOCK_THRESHOLD:-10}
      ACCOUNT_LOCK_MINUTES: ${ACCOUNT_LOCK_MINUTES:-15}

      # 对象存储 —— 整机部署演示用 compose 内的 minio(s3 兼容协议)
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-cn-hangzhou}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      S3_BUCKET: ${S3_BUCKET:-fulfillment-attachments}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    # 对外暴露(过渡期保留,正式接反向代理后可删)
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    logging: *default-logging

  # 注:frontend 目前只有本地开发用的 Next dev 脚手架,还没有 Dockerfile(见 README「待接」),
  # 这里先占位保留服务定义;`docker compose up` 全量起会在 frontend 这一步失败,
  # 在 Dockerfile 补齐前用 `docker compose up db minio backend` 起后端三件套。
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8001}
    ports:
      - "${FRONTEND_HOST_PORT:-3001}:3000"
    logging: *default-logging

volumes:
  pgdata:
    name: fulfillment_pgdata
  miniodata:
    name: fulfillment_miniodata
