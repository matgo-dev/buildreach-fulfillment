name: PR Tests

on:
  pull_request:
  push:
    branches: ["main", "feat/**", "fix/**"]

# 同分支多次 push 只保留最新一个
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (PG 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fulfillment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fulfillment_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fulfillment_test
      JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production-1234567890
      # Settings 必填项(无默认值):pytest 由 conftest setdefault 兜底,alembic 步直接读这里
      SUPER_ADMIN_INITIAL_PASSWORD: Aa123456789

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      # 后端生产依赖漏洞审计:Dependabot 不支持 uv,这里用 pip-audit 查 OSV 库兜底。
      # 只扫生产依赖(--no-dev),导出已是完整解析的扁平清单故 --no-deps。
      # 当前零漏洞,任何新发现即阻断合并——不预设白名单,真出现上游不修的条目再单独评估。
      - name: Audit production deps (Python)
        working-directory: backend
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt > /tmp/backend-requirements.txt
          uvx pip-audit -s osv --no-deps --disable-pip -r /tmp/backend-requirements.txt

      - name: Run tests
        working-directory: backend
        run: |
          source .venv/bin/activate
          pytest -v --tb=short

      - name: Frontend permissions are generated from backend (single source)
        working-directory: backend
        run: |
          source .venv/bin/activate
          python scripts/gen_frontend_permissions.py
          # 前端权限码是后端 constants.py 的派生产物;若后端改了码却没重生成则报红。
          git diff --exit-code -- ../frontend/src/config/permission-matrix.ts \
            || { echo "::error::permission-matrix.ts 已过期,请在 backend 下运行 python scripts/gen_frontend_permissions.py 后提交"; exit 1; }

      - name: Test database migration (alembic upgrade head)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fulfillment_test
          SQLALCHEMY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fulfillment_test
        run: |
          source .venv/bin/activate
          echo "🔄 Testing database migration with real PostgreSQL..."
          sleep 2
          alembic upgrade head
          echo "✅ Migration test passed!"
          alembic current

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 生产依赖漏洞审计:本地 .npmrc 指向 npmmirror(无 audit 端点),CI 显式打官方 registry。
      # 门槛 high:Next 15 迁移后原 Next 14 的 DoS 已清;Next 自带的 postcss/sharp 传递高危
      # 用 pnpm.overrides 顶到修复版(见 frontend/package.json)。--prod 只卡运行时依赖,
      # devDep(eslint 工具链)的高危不进部署产物、不计入。
      - name: Audit production deps
        working-directory: frontend
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org

      # next lint:ESLint 报错(errors)阻断合并;既有 warnings 不阻断
      - name: Lint
        working-directory: frontend
        run: pnpm lint

      # next build:类型检查(tsc)+ 产物构建,任一失败即红
      - name: Build
        working-directory: frontend
        run: pnpm build
