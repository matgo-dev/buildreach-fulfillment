# 依赖版本更新与安全告警。
#
# 覆盖范围说明:
# - 前端 pnpm:Dependabot 用 `npm` 这个生态标识处理 pnpm-lock.yaml。
# - GitHub Actions:锁 action 版本漂移。
# - 后端 Python:Dependabot **不支持 uv**(pip 生态只覆盖 pip/pipenv/pip-compile/poetry,
#   读不了 uv.lock),所以后端依赖漏洞靠 CI 里的 pip-audit 步骤兜,不在这里配。
#
# 注意:本文件只管「版本更新」。「安全更新」(有漏洞时自动开修复 PR)还需要在
# GitHub 仓库 Settings → Advanced Security 里打开 Dependabot alerts + security updates。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 小版本合并成一个 PR,避免每周十几个 PR 的噪声;大版本单独开,便于评估破坏性改动。
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
