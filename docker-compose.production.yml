# ============================================================
# 履约后台 · 生产部署编排(拉镜像模式)
#
# 镜像由 CI(.github/workflows/deploy.yml)构建并推 ACR(阿里云,给 ECS)/ GHCR(给 OVH);
# 本文件在服务器上被 deploy/deploy.sh 调用:拉镜像 → 起容器 → 健康检查(失败自动回滚)。
# 反向代理 + TLS 由宿主 1Panel(OpenResty)承载,应用端口只绑 127.0.0.1。
#
# 用法(一般由 deploy/deploy.sh 调,手动亦可):
#   IMAGE_TAG=<tag> docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# PG 短期取舍:单机 Docker PG + named volume + 发布前本机 pg_dump;
# 异地备份/托管 PG 暂缓。生产对象存储必须使用外部 S3 兼容服务;
# 本机 MinIO 仅限 staging/local-minio profile,见 deploy/README-deploy.md。
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "5432"
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    profiles: ["local-minio"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    # 不设 healthcheck:minio 镜像无 curl/wget(仅 mc),原 curl 健康检查必挂;就绪靠 minio-init 重试。
    logging: *default-logging

  # 一次性建桶(幂等)。仅随 local-minio profile 启动;生产 bucket 由外部对象存储面板预建。
  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    profiles: ["local-minio"]
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-} >/dev/null 2>&1 && mc ls local >/dev/null 2>&1; do echo 'waiting for minio...'; sleep 2; done &&
      mc mb --ignore-existing local/${S3_BUCKET:-fulfillment-attachments}
      "
    logging: *default-logging

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/matgo-dev/buildreach-fulfillment}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORAGE_BACKEND: ${STORAGE_BACKEND:?STORAGE_BACKEND is required}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      REFRESH_COOKIE_MAX_AGE: ${REFRESH_COOKIE_MAX_AGE:-604800}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_MAX_FAILURES: ${LOGIN_RATE_LIMIT_MAX_FAILURES:-5}
      LOGIN_RATE_LIMIT_LOCK_SECONDS: ${LOGIN_RATE_LIMIT_LOCK_SECONDS:-300}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      TRUST_INBOUND_TRACE_ID: ${TRUST_INBOUND_TRACE_ID:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ENABLE_HSTS: ${ENABLE_HSTS:-false}
      ACCOUNT_LOCK_THRESHOLD: ${ACCOUNT_LOCK_THRESHOLD:-10}
      ACCOUNT_LOCK_MINUTES: ${ACCOUNT_LOCK_MINUTES:-15}
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_HOST_PORT:-17858}:8000"
    logging: *default-logging

  frontend:
    image: ${IMAGE_REGISTRY:-ghcr.io/matgo-dev/buildreach-fulfillment}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 运行时注入:entrypoint.sh 生成 __env.js 供浏览器读取
      API_BASE_URL: ${API_BASE_URL}
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-7858}:3000"
    logging: *default-logging

volumes:
  pgdata:
    name: ${PGDATA_VOLUME_NAME:-fulfillment_pgdata}
  miniodata:
    name: ${MINIODATA_VOLUME_NAME:-fulfillment_miniodata}
