# ============================================================
# 初期(阿里云 ECS)叠加层 —— 把 db + minio 作为容器陪跑
#
# docker compose 默认自动合并本文件(命名即 docker-compose.override.yml)。
#   初期:docker compose up -d --build                       → 自动含本文件,起 db + minio
#   生产:docker compose -f docker-compose.yml up -d --build → 不含本文件,库/存储走 OVH 托管
#
# 本文件只做两件事:① 提供 db / minio / 建桶 容器;② 让 backend 等它们就绪。
# backend 连它们的地址由 .env 指向(DATABASE_URL→db:5432、S3_ENDPOINT_URL→http://minio:9000),
# 不在此重设 —— 见 .env.example 的「初期」块。
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fulfillment}
      POSTGRES_USER: ${POSTGRES_USER:-fulfillment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设 POSTGRES_PASSWORD(须与 DATABASE_URL 里口令一致)}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulfillment} -d ${POSTGRES_DB:-fulfillment}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # 不映射到宿主,只在 compose 内网可见(backend 走 db:5432)
    expose:
      - "5432"
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 设 MINIO_ROOT_PASSWORD(须与 S3_SECRET_KEY 一致)}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    # S3 API(9000)不映射宿主,backend 走 compose 内网 http://minio:9000;仅控制台绑 127.0.0.1 备排障
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # 一次性建桶(幂等 --ignore-existing)。没有它首次上传附件会 NoSuchBucket(500)。
  # 生产走 OVH Object Storage,bucket 由运维在面板预建,无此服务(本文件不参与生产)。
  minio-init:
    image: minio/mc:RELEASE.2024-01-13T08-44-48Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${S3_BUCKET:-fulfillment-attachments}
      "
    logging: *default-logging

  # 叠加到 base 的 backend:初期要等 db / minio / 建桶 就绪再启动
  backend:
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: fulfillment_pgdata
  miniodata:
    name: fulfillment_miniodata
